services:
    hvlab:
        image: hvlab:v0
        container_name: hvlab
        build:
            context: .
            dockerfile: Dockerfile
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        network_mode: "host"
        stdin_open: true
        tty: true
        environment:
            - ACCEPT_EULA=Y
            - PRIVACY_CONSENT=Y
        volumes:
            - ./ASAP:/workspace/ASAP
            - ./GMR:/workspace/GMR
            - ./motion:/workspace/motion
            - ./script:/workspace/script
            - ./test:/workspace/test
            # 학습 로그/체크포인트가 호스트에 남도록
            - ./logs:/workspace/logs
            - isaac-cache-kit:/isaac-sim/kit/cache
            - isaac-cache-ov:/home/hvlab/.cache/ov
            - isaac-cache-pip:/home/hvlab/.cache/pip
            - isaac-cache-gl:/home/hvlab/.cache/nvidia/GLCache
            - isaac-cache-compute:/home/hvlab/.nv/ComputeCache
            - isaac-logs:/home/hvlab/.nvidia-omniverse/logs
            - isaac-data:/home/hvlab/.local/share/ov/data

volumes:
    isaac-cache-kit:
    isaac-cache-ov:
    isaac-cache-pip:
    isaac-cache-gl:
    isaac-cache-compute:
    isaac-logs:
    isaac-data:
